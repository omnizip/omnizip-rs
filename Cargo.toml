[workspace]
members = [
    "omnizip-codecs",
    "omnizip-lzma",
    "omnizip-zstd",
    "omnizip-snappy",
    "omnizip-lz4",
    "omnizip-deflate",
    "omnizip-brotli",
    "omnizip-filters",
    "omnizip-fsst",
    "omnizip-ricepp",
    "omnizip-flac",
    "tests/differential",
]
resolver = "2"

[workspace.package]
version = "0.9.3"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omnizip/omnizip-rs"
homepage = "https://github.com/omnizip/omnizip-rs"
description = "Pure-Rust compression codecs — ports of omnizip's Ruby reference implementations"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
omnizip-codecs = { path = "omnizip-codecs", version = "0.9.3" }
omnizip-lzma = { path = "omnizip-lzma", version = "0.9.3" }
omnizip-zstd = { path = "omnizip-zstd", version = "0.9.3" }
brotli = "8.0"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
miniz_oxide = "0.8"
snap = "1.1"

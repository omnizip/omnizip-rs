[workspace]
members = [
    "omnizip-codecs",
    "omnizip-lzma",
    "omnizip-zstd",
    "omnizip-snappy",
    "omnizip-lz4",
    "omnizip-deflate",
    "omnizip-deflate64",
    "omnizip-libdeflate",
    "omnizip-brotli",
    "omnizip-filters",
    "omnizip-fsst",
    "omnizip-ricepp",
    "omnizip-flac",
    "omnizip-blosc",
    "omnizip-glza",
    "omnizip-ppmd",
    "omnizip-zpaq",
    "omnizip-bzip2",
    "omnizip-bench",
    "tests/differential",
    "tests/determinism",
]
resolver = "2"

[workspace.package]
version = "0.14.20"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omnizip/omnizip-rs"
homepage = "https://github.com/omnizip/omnizip-rs"
description = "Pure-Rust compression codecs — ports of omnizip's Ruby reference implementations"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
omnizip-codecs = { path = "omnizip-codecs", version = "0.14.0" }
omnizip-lzma = { path = "omnizip-lzma", version = "0.14.0" }
omnizip-zstd = { path = "omnizip-zstd", version = "0.14.0" }
omnizip-lz4 = { path = "omnizip-lz4", version = "0.14.0" }
# Dev-only: used for cross-compat tests, not in the hot path.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
snap = "1.1"

[workspace]
# Use glob patterns so missing directories at old git commits don't
# break cargo metadata (fixes release-plz historical comparison).
members = [
    "ozip",
    "omnizip-rar",
    "omnizip-par2",
    "omnizip-ole",
    "omnizip-xar",
    "omnizip-iso",
    "omnizip-*",
    "tests/differential",
    "tests/determinism",
    "tests/property",
    "tests/benchmarks",
    "tests/conformance",
    "tests/security",
    "tests/fuzz_smoke",
]
exclude = [
    # Fuzz targets use cargo-fuzz's own build pipeline (no_main, libfuzzer-sys).
    # Run via `cargo fuzz run <target>` from tests/fuzz/.
    "tests/fuzz",
]
resolver = "2"

[workspace.package]
version = "0.21.113"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omnizip/omnizip-rs"
homepage = "https://github.com/omnizip/omnizip-rs"
description = "Pure-Rust compression codecs — ports of omnizip's Ruby reference implementations"

[workspace.lints.rust]
unsafe_code = "forbid"

# Workspace clippy config: deliberately minimal. The CI runs clippy
# with -D warnings; individual crates can opt into stricter lints via
# crate-level attributes. Setting lint groups (all/pedantic) at the
# workspace level causes priority conflicts with individual allows.
[workspace.lints.clippy]

[workspace.dependencies]
omnizip-codecs = { path = "omnizip-codecs", version = "0.21.113" }
omnizip-ppmd = { path = "omnizip-ppmd", version = "0.21.113" }
omnizip-tar = { path = "omnizip-tar", version = "0.21.113" }
omnizip-cpio = { path = "omnizip-cpio", version = "0.21.113" }
omnizip-sevenzip = { path = "omnizip-sevenzip", version = "0.21.113" }
omnizip-rar = { path = "omnizip-rar", version = "0.21.113" }
omnizip-iso = { path = "omnizip-iso", version = "0.21.113" }
omnizip-rpm = { path = "omnizip-rpm", version = "0.21.113" }
omnizip-xar = { path = "omnizip-xar", version = "0.21.113" }
omnizip-ole = { path = "omnizip-ole", version = "0.21.113" }
omnizip-lzma = { path = "omnizip-lzma", version = "0.21.113" }
omnizip-bzip2 = { path = "omnizip-bzip2", version = "0.21.113" }
omnizip-zstd = { path = "omnizip-zstd", version = "0.21.113" }
omnizip-lz4 = { path = "omnizip-lz4", version = "0.21.113" }
omnizip-deflate = { path = "omnizip-deflate", version = "0.21.113" }
omnizip-deflate64 = { path = "omnizip-deflate64", version = "0.21.113" }
omnizip-libdeflate = { path = "omnizip-libdeflate", version = "0.21.113" }
omnizip-archive-core = { path = "omnizip-archive-core", version = "0.21.113" }
omnizip-zip = { path = "omnizip-zip", version = "0.21.113" }
omnizip-checksum = { path = "omnizip-checksum", version = "0.21.113" }
omnizip-par2 = { path = "omnizip-par2", version = "0.21.113" }
omnizip-crypto = { path = "omnizip-crypto", version = "0.21.113" }
omnizip-filters = { path = "omnizip-filters", version = "0.21.113" }
# Dev-only: used for cross-compat tests, not in the hot path.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
snap = "1.1"

# Continuous Integration for omnizip-rs
#
# Jobs:
# - Spell check (typos)
# - Security audit (cargo-audit + cargo-deny)
# - Format and lint (fmt + clippy + doc)
# - Unused dependency check (cargo-machete)
# - Multi-platform Rust tests (Linux, macOS, Windows)
# - C++ binding tests (cmake + ctest)
# - Semver compatibility check

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # RUSTFLAGS: "-D warnings"  # Disabled: crates use #![warn(clippy::pedantic)] which elevates under -D warnings

jobs:
  # ============================================================================
  # Typos Check
  # ============================================================================
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  # ============================================================================
  # Pre-flight: skip CI when only docs/markdown changed
  # ============================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if code changed
        id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Release-plz PRs and their merge commits are version + changelog
          # bumps only; the code they carry was already fully verified, and
          # re-running the ~40-leg matrix per release duplicated CI for zero
          # signal. Skip both (release.yml publishes independently of CI).
          subject="$(git log -1 --format=%s)"
          if [[ "$HEAD_REF" == release-plz* ]] || [[ "$subject" == "chore: release v"* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qE '\.(rs|cpp|h|hpp|toml|cmake)$|CMakeLists\.txt'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and advisories
        run: cargo deny check licenses advisories sources bans

  # ============================================================================
  # Format and Lint
  # ============================================================================
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo tools
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -A clippy::pedantic

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-A rustdoc::broken_intra_doc_links -A rustdoc::missing-backticks"

  # ============================================================================
  # Unused Dependencies
  # ============================================================================
  machete:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  # ============================================================================
  # Publish Check (Dry Run)
  # ============================================================================
  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Publish check
        run: cargo publish --dry-run -p omnizip-codecs

  # ============================================================================
  # Rust Tests (Multi-platform)
  # ============================================================================
  # One serial `cargo test --workspace` job per OS took hours (the codec
  # parity suites dominate). The group matrix fans the workspace out so
  # heavy crates get their own runners; the union of groups covers every
  # workspace member. When adding a crate, place it in the lightest-fit
  # group.
  test:
    name: Test (${{ matrix.group.name }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Full matrix: linux amd64 (ubuntu-latest), linux arm64
        # (ubuntu-24.04-arm native runner), macOS arm64 (macos-latest),
        # macOS Intel (macos-15-intel), Windows amd64 (windows-latest).
        # ppc64le/s390x are covered by the cross-compile job below
        # (qemu, no native runners available).
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
        group:
          - name: codecs-parity-a
            crates: omnizip-codecs omnizip-brotli
          - name: codecs-parity-b
            crates: omnizip-zstd omnizip-lzma
          - name: codecs-parity-c
            crates: omnizip-flac omnizip-libdeflate omnizip-deflate omnizip-deflate64
          - name: codecs-rest
            crates: >-
              omnizip-bzip2 omnizip-lz4 omnizip-snappy omnizip-ppmd omnizip-glza
              omnizip-zpaq omnizip-fsst omnizip-ricepp omnizip-blosc
              omnizip-checksum omnizip-ffi omnizip-filters omnizip-crypto
          - name: containers-a
            crates: omnizip-archive-core omnizip-tar omnizip-zip omnizip-cpio omnizip-sevenzip omnizip-rpm
          - name: containers-b
            crates: omnizip-iso omnizip-xar omnizip-ole omnizip-par2 omnizip-rar
          - name: harness
            crates: >-
              ozip omnizip-bench omnizip-differential omnizip-determinism
              omnizip-property omnizip-conformance omnizip-security-tests
              omnizip-benchmarks fuzz-smoke
    steps:
      - uses: actions/checkout@v7

      # rnp-src compiles librnp + Botan from source via cmake. On
      # Windows, it forces the GCC/MinGW toolchain (via MSYS2 UCRT64).
      # This requires the GNU Rust target instead of the default MSVC.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: gcc cmake ninja

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Switch to GNU toolchain (Windows)
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.group.name }}
          cache-on-failure: true

      - name: Run tests
        shell: bash
        run: |
          for crate in ${{ matrix.group.crates }}; do
            echo "::group::cargo test -p $crate"
            cargo test -p "$crate" --verbose
            echo "::endgroup::"
          done



  # ============================================================================
  # Cross-compile for ppc64le/s390x (no native runners; qemu via cross).
  # Build-only: catches platform-specific compile errors and
  # endianness assumptions. Runtime testing via release wheels.
  # ============================================================================
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
          cache-on-failure: true

      - name: Build workspace
        run: cross build --workspace --target ${{ matrix.target }} --exclude fuzz-smoke

      - name: Build tests
        run: cross build --workspace --target ${{ matrix.target }} --tests --exclude fuzz-smoke

  # ============================================================================
  # MSRV — the declared rust-version (workspace 1.75) must stay true.
  # Issue #638: the floor was violated by post-1.75 language features
  # (inline-const in statics, is_none_or) and only surfaced as a
  # downstream MSRV-CI failure. Issue #715: an x86_64-only leg is blind
  # to target-gated deps — aes 0.9's aarch64-gated cpubits
  # (edition2024) shipped silently and broke every 1.75 consumer on
  # aarch64 hosts. The codec + crypto + AES-container set is now
  # checked at the declared floor on BOTH the host target and
  # aarch64-unknown-linux-gnu (cross-resolve catches cfg-gated
  # edition2024 edges). The bench/harness crates remain out of scope:
  # their closures (ureq→idna_adapter, clap_lex) carry edition2024.
  # ============================================================================
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.75

      - name: Generate the lock at the floor toolchain
        run: cargo generate-lockfile

      - name: Check codec + crypto crates at the declared floor (host)
        run: >
          cargo check --locked --lib --tests
          -p omnizip-codecs -p omnizip-brotli -p omnizip-zstd -p omnizip-lzma
          -p omnizip-bzip2 -p omnizip-deflate -p omnizip-deflate64 -p omnizip-lz4
          -p omnizip-snappy -p omnizip-ppmd -p omnizip-glza -p omnizip-zpaq
          -p omnizip-fsst -p omnizip-ricepp -p omnizip-flac -p omnizip-filters
          -p omnizip-libdeflate -p omnizip-blosc
          -p omnizip-crypto -p omnizip-zip -p omnizip-rar
          -p omnizip-sevenzip -p omnizip-par2

      - name: Check the same set cross-target aarch64 (cfg-gated dep edges)
        run: >
          cargo check --locked --lib --tests --target aarch64-unknown-linux-gnu
          -p omnizip-codecs -p omnizip-lzma -p omnizip-crypto -p omnizip-zip
          -p omnizip-rar -p omnizip-sevenzip -p omnizip-par2

  # ============================================================================
  # Semver Compatibility Check
  # ============================================================================
  semver:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    needs: [preflight]
    if: github.event_name == 'pull_request' && needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Check semver compatibility
        run: cargo semver-checks --baseline-rev origin/${{ github.base_ref }} --allow-dirty || true

  # ============================================================================
  # Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [typos, security, lint, machete, publish-check, test, msrv]
    if: always()
    steps:
      - name: Report status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All checks passed
        run: echo "All CI checks passed!"

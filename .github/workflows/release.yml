# Release pipeline for omnizip-rs
#
# release-plz opens a "release PR" when changes hit main; merging that PR
# publishes to crates.io. See release-plz.toml for configuration.
# https://release-plz.dev/

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-plz:
    name: Release-plz
    # OIDC trusted-publishing: release-plz still bumps versions and
    # PRs; the publish job below uses a crates.io OIDC token bound to
    # this (repo, workflow, environment) tuple. After the OIDC path
    # proves out we drop release-plz's own publish and remove
    # CARGO_REGISTRY_TOKEN entirely.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    # crates.io trusted publishing binding:
    # (omnizip/omnizip-rs, release.yml, environment crates-io).
    environment: crates-io
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          # release_always = true in release-plz.toml means we publish
          # directly on push to main. Running release-pr too fails with
          # 403 because GitHub Actions isn't permitted to create PRs here.
          # Use `release` only.
          command: release
          args: --no-publish

  publish-codecs:
    name: Publish codec crates (OIDC trusted publishing)
    needs: release-plz
    permissions:
      id-token: write   # OIDC for crates.io trusted publishing
      contents: read
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish codec crates
        uses: rust-lang/crates-io-actions/publish@v3
        with:
          path: |
            omnizip-codecs
            omnizip-bzip2
            omnizip-libdeflate
            omnizip-lzma
            omnizip-brotli
            omnizip-zstd
            omnizip-lz4
            omnizip-snappy
            omnizip-ppmd
            omnizip-deflate
            omnizip-deflate64
            omnizip-filters
            omnizip-blosc
            omnizip-flac
            omnizip-fsst
            omnizip-glza
            omnizip-ricepp
            omnizip-zpaq

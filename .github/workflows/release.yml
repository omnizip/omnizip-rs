# Release pipeline for omnizip-rs
#
# release-plz opens a "release PR" when changes hit main; merging that PR
# publishes to crates.io. See release-plz.toml for configuration.
# https://release-plz.dev/

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      command:
        description: "release-pr opens the version-bump PR (via the CI PAT); release publishes what the manifests say"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - release-pr

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    # crates.io trusted publishing binding:
    # (omnizip/omnizip-rs, release.yml, environment crates-io).
    environment: crates-io
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        # The action has no GITHUB_TOKEN input: its shell reads the
        # GITHUB_TOKEN env var. Step env overrides the workflow-level
        # default, and propagates into the composite action's steps.
        # release-pr creates PRs; the repo setting blocks workflow-
        # token PRs, so that command rides the CI PAT.
        env:
          GITHUB_TOKEN: ${{ inputs.command == 'release-pr' && secrets.OMNIZIP_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          # Push to main always publishes (release_always in
          # release-plz.toml). The release-pr COMMAND is dispatch-
          # only: it opens the next version-bump PR through the PAT.
          command: ${{ inputs.command || 'release' }}

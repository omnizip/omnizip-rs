# Release pipeline for omnizip-rs
#
# release-plz opens a "release PR" when changes hit main; merging that PR
# publishes to crates.io. See release-plz.toml for configuration.
# https://release-plz.dev/

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        with:
          # release_always = true in release-plz.toml means we publish
          # directly on push to main. Running release-pr too fails with
          # 403 because GitHub Actions isn't permitted to create PRs here.
          # Use `release` only.
          command: release

# Release pipeline for omnizip-rs
#
# Modeled after the confium pattern (release-plz for crates.io) plus
# the limnifs pattern (tag-driven binary release + checksums).
#
# release-plz opens a "release PR" when changes hit main; merging that
# PR publishes all crates to crates.io in dependency order. See
# release-plz.toml for configuration. https://release-plz.dev/
#
# Tag pushes (v*) additionally trigger a GitHub Release with
# auto-generated notes (limnifs-style).

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── release-plz: crates.io publishing ─────────────────────────────
  # Runs on every push to main. Opens a release PR when conventional
  # commits indicate a version bump is needed. Merging the PR publishes.
  release-plz:
    name: Release-plz
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5.131
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── GitHub Release: tag-triggered ─────────────────────────────────
  # When a v* tag is pushed (either by release-plz or manually),
  # publish a GitHub Release with auto-generated notes. No binary
  # artifacts for omnizip-rs (library-only workspace).
  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false

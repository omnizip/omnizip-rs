# One-off manual publish for omnizip-deflate64.
#
# Why this exists: release-plz can't publish omnizip-deflate64 because
# commit 8ba1c91 (where the crate was first added) has a workspace
# Cargo.toml that references omnizip-bzip2/ before that directory
# existed. release-plz's check_package_equality runs cargo package at
# that commit and fails before the is_commit_too_old early-exit can
# trigger. See release-plz.toml for the full explanation.
#
# This workflow does a one-time cargo publish for omnizip-deflate64
# at the current workspace version. Once the tag exists, release-plz
# will use it as the baseline for future releases and the historical
# walk will stop at the tag before reaching 8ba1c91.
#
# Trigger: manual via workflow_dispatch.
# After a successful run, re-enable omnizip-deflate64 in release-plz.toml.

name: Publish omnizip-deflate64

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish omnizip-deflate64
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p omnizip-deflate64

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='omnizip-deflate64'))")
          tag="omnizip-deflate64-v${version}"
          git tag "$tag"
          git push origin "$tag"
          echo "Created tag $tag"

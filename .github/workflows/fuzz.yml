name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [brotli_round_trip, zstd_round_trip, lzma_round_trip, lz4_round_trip, deflate_round_trip, brotli_decode_no_panic, zstd_decode, bzip2_decode, deflate_decode, lz4_decode, ppmd7_decode, ppmd8_decode, deflate64_decode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        working-directory: tests/fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore
      - name: Open issue on crash
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Nightly fuzz crash: ${{ matrix.target }} (${{ github.run_id }})'
          content-filepath: /tmp/fuzz-report.md
          labels: bug,fuzz

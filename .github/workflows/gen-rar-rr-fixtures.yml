name: Generate RAR5 RR fixtures

# CLI parity (omnizip-rs #711): RAR5 recovery-record repair is blocked
# on fixtures — the local `rar` binary is Gatekeeper-killed, so
# recovery-record archives cannot be created on macOS. This job
# generates them on Linux (rar is in Ubuntu multiverse) and opens a
# PR with the binary fixtures + checksums. Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rar
        run: |
          sudo apt-get update
          sudo apt-get install -y rar

      - name: Generate fixtures
        run: |
          bash tests/fixtures/gen_rar_rr.sh omnizip-rar/tests/fixtures

      - name: SHA256 manifest
        run: |
          cd omnizip-rar/tests/fixtures/rr
          sha256sum *.rar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Commit + PR
        run: |
          git config user.name "omnizip-ci"
          git config user.email "ci@omnizip.invalid"
          git checkout -b chore/rr-fixtures-$(date +%Y%m%d%H%M%S)
          git add omnizip-rar/tests/fixtures/rr
          git commit -m "test(rar): RAR5 recovery-record fixtures (task 55 unblock)

          Generated on ubuntu (rar 6.x, RAR5 format, -rr3/-rr10) over
          deterministic content; SHA256SUMS manifest included. Created
          by .github/workflows/gen-rar-rr-fixtures.yml — the local
          macOS rar binary is Gatekeeper-killed, making local
          generation impossible."
          git push origin HEAD
          gh pr create --title "test(rar): RAR5 recovery-record fixtures (task 55 unblock)" \
            --body "Generated by the gen-rar-rr-fixtures workflow. Unblocks the RAR5 RR parse/repair work in task 55." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.OMNIZIP_CI_PAT_TOKEN }}

name: Differential

# Differential parity tests against reference implementations.
#
# Pins for the reference C tools:
# - xz-utils: required for xz + lzma + lzip tests
# - zstd: required for zstd round-trips
# - bzip2: required for bzip2 tests
# - flac: required for flac tests
# - brotli: required for brotli tests
#
# The Ruby omnizip reference is optional. The differential tests
# fall back to C-tool-only parity if Ruby is unavailable.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:00 UTC — catches reference-SHA drift.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-linux:
    name: differential (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + index
        uses: Swatinem/rust-cache@v2

      - name: Install C reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils zstd libflac-dev bzip2 brotli

      - name: Build
        run: cargo build --workspace --release

      - name: Run differential harness
        run: cargo test --workspace --release --test differential
        timeout-minutes: 30
        continue-on-error: true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failures
          path: tests/differential/failures/
          retention-days: 30
          if-no-files-found: ignore

# Release-plz configuration for omnizip-rs
# https://release-plz.dev/docs/config

[workspace]
# release-plz handles versioning + publishing for the whole workspace.
git_release_enable = false
dependencies_update = true
allow_dirty = false
# Always create a release PR when there are changes on main.
# This skips the "did packages change since last release?" check
# which fails because old git commits have broken workspace manifests.
release_always = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""

# omnizip-deflate64 was first added at a commit whose workspace manifest
# referenced omnizip-bzip2/ before that directory existed. release-plz's
# package-equality walk calls `cargo package` at each historical commit
# and fails at that one, blocking every other crate's release. The
# underlying release-plz bug is that `check_package_equality` runs before
# `is_commit_too_old`, so the ancestor-of-tag early-exit never triggers.
# Skipping this crate entirely unblocks the workspace. Re-enable once
# upstream release-plz fixes the ordering, or once the broken commit is
# far enough back that the walk no longer reaches it.
[[package]]
name = "omnizip-deflate64"
release = false

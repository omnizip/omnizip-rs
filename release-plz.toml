# Release-plz configuration for omnizip-rs
# https://release-plz.dev/docs/config

[workspace]
# release-plz handles versioning + publishing for the whole workspace.
git_release_enable = false
dependencies_update = true
allow_dirty = false
# Always create a release PR when there are changes on main.
# This skips the "did packages change since last release?" check
# which fails because old git commits have broken workspace manifests.
release_always = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""

# omnizip-deflate64 was previously held back because release-plz's
# historical-commit walk reached commit 8ba1c91 (where the workspace
# referenced omnizip-bzip2/ before it existed) and failed. A one-time
# manual publish (see .github/workflows/publish-deflate64.yml) created
# the omnizip-deflate64-v0.15.0 tag. Future release-plz runs now stop
# at that tag via is_commit_too_old before reaching the broken commit.

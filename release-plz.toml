# Release-plz configuration for omnizip-rs
# https://release-plz.dev/docs/config

[workspace]
# release-plz handles versioning + publishing for the whole workspace.
git_release_enable = false
dependencies_update = true
allow_dirty = false
# Always create a release PR when there are changes on main.
# This skips the "did packages change since last release?" check
# which fails because old git commits have broken workspace manifests.
release_always = true

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""

# omnizip-deflate64 was added at commit 8ba1c91 in a workspace that
# temporarily listed omnizip-bzip2 as a member before that directory
# existed. release-plz's changelog generation walks back to that commit
# to compute the diff, and `cargo metadata` fails there. Skipping
# changelog generation for this one crate unblocks the workspace release.
# Re-enable once enough release-plz runs have passed that the baseline
# moves past 8ba1c91.
[[package]]
name = "omnizip-deflate64"
changelog_update = false

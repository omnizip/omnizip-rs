[package]
name = "omnizip-zstd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Zstandard encoder + decoder — port of omnizip's Ruby reference"
keywords = ["compression", "zstd", "zstandard", "fse", "huffman"]
categories = ["compression"]

[lib]
name = "omnizip_zstd"
path = "src/lib.rs"

[features]
# Enable experimental SIMD batching for the Huffman decode inner loop
# via the `wide` crate. Without SIMD gather (which `wide` does not
# expose and `std::simd` only offers on nightly), the speedup is
# limited to ~5-15% from vectorised bit-position arithmetic. Off by
# default; flip on with `--features simd-huffman`.
default = []
simd-huffman = ["dep:wide"]

[dependencies]
omnizip-codecs = { workspace = true }
wide = { version = "1.5", optional = true }

[lints]
workspace = true

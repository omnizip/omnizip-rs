[package]
name = "omnizip-sevenzip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "7z archive container (signature/start header, property-encoded metadata, LZMA/LZMA2/BZip2/Deflate/Copy folders, filters, AES) on omnizip-archive-core"
keywords = ["compression", "7z", "sevenzip"]
categories = ["compression"]

[lib]
name = "omnizip_sevenzip"
path = "src/lib.rs"

[dependencies]
omnizip-archive-core = { path = "../omnizip-archive-core", version = "0.21.110" }
omnizip-lzma = { path = "../omnizip-lzma", version = "0.21.110" }
omnizip-bzip2 = { path = "../omnizip-bzip2", version = "0.21.110" }
omnizip-libdeflate = { path = "../omnizip-libdeflate", version = "0.21.110" }
omnizip-filters = { path = "../omnizip-filters", version = "0.21.110" }
omnizip-crypto = { path = "../omnizip-crypto", version = "0.21.110" }

[lints]
workspace = true

[package]
name = "omnizip-flac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust FLAC audio codec — PCM header parsers (WAV, AIFF) + full LPC + Rice encoder"
keywords = ["compression", "flac", "audio", "pcm"]
categories = ["compression", "multimedia::audio"]

[dependencies]
omnizip-codecs.workspace = true

[features]
# Enable wide::i32x8 vectorisation of the LPC residual loop and the
# autocorrelation inner product. Off by default; turn on with
# --features omnizip-flac/simd-lpc. Adds a dependency on `wide`.
default = []
simd-lpc = ["dep:wide"]

[dependencies.wide]
version = "1.6"
optional = true

[lints]
workspace = true

[package]
name = "omnizip-rpm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RPM package format (lead, signature/header tags, cpio payload over gzip/bzip2/xz/zstd) on omnizip-archive-core"
keywords = ["compression", "rpm", "package"]
categories = ["compression"]

[lib]
name = "omnizip_rpm"
path = "src/lib.rs"

[dependencies]
omnizip-archive-core = { path = "../omnizip-archive-core" }
omnizip-cpio = { path = "../omnizip-cpio" }
omnizip-lzma = { path = "../omnizip-lzma" }
omnizip-zstd = { path = "../omnizip-zstd" }
omnizip-crypto = { path = "../omnizip-crypto" }

[lints]
workspace = true

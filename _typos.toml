# Typos configuration — ignore proper names, technical terms, algorithm names
[default.extend-words]
Collet = "Collet"
Cleary = "Cleary"
sais = "sais"
ser = "ser"
nam = "nam"
mis = "mis"
siz = "siz"
cpy = "cpy"
CLEN = "CLEN"
uncompressible = "uncompressible"
ful = "ful"
nto = "nto"
nd = "nd"
lits = "lits"
indx = "indx"

# Exclude binary dictionary files and generated tables
[files]
extend-exclude = [
  "omnizip-brotli/data/*",
  "omnizip-zstd/src/predef_tables.rs",
  "target/",
  "docs/RFC-7932-brotli.txt",
]

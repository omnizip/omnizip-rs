[package]
name = "omnizip-ricepp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust Rice++ codec for integer-pixel data (FITS images, sensor data) — port of DwarFS ricepp"
keywords = ["compression", "rice", "ricepp", "fits", "sensor"]
categories = ["compression", "science"]

[dependencies]
omnizip-codecs.workspace = true

[features]
# Enable wide::u64x4 vectorisation of the delta+zigzag+sum loop in
# encode_block. Default off; turn on with
# --features omnizip-ricepp/simd-delta.
default = []
simd-delta = ["dep:wide"]

[dependencies.wide]
version = "1.6"
optional = true

[lints]
workspace = true

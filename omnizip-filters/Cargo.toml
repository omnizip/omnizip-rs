[package]
name = "omnizip-filters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust preprocessing filters — delta and BCJ (executable code) transforms"
keywords = ["compression", "filter", "delta", "bcj"]
categories = ["compression"]

[lib]
name = "omnizip_filters"
path = "src/lib.rs"

[dependencies]
omnizip-codecs.workspace = true

[dev-dependencies]
# Path-only: a `version` pin makes cargo publish require that exact
# omnizip-lz4 release in the crates.io index, but release-plz orders
# publishing by normal deps only, so lz4 may not be published yet.
omnizip-lz4 = { path = "../omnizip-lz4" }

[lints]
workspace = true

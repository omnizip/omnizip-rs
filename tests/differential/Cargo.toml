[package]
name = "omnizip-differential"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-language differential test harness for omnizip-rs codecs"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
omnizip-codecs = { path = "../../omnizip-codecs", version = "0.21.55" }
omnizip-lzma = { path = "../../omnizip-lzma", version = "0.21.55" }
omnizip-zstd = { path = "../../omnizip-zstd", version = "0.21.55" }
omnizip-brotli = { path = "../../omnizip-brotli", version = "0.21.55" }
omnizip-bzip2 = { path = "../../omnizip-bzip2", version = "0.21.55" }
omnizip-lz4 = { path = "../../omnizip-lz4", version = "0.21.55" }
omnizip-deflate = { path = "../../omnizip-deflate", version = "0.21.55" }
omnizip-flac = { path = "../../omnizip-flac", version = "0.21.55" }
omnizip-libdeflate = { path = "../../omnizip-libdeflate", version = "0.21.55" }
omnizip-ricepp = { path = "../../omnizip-ricepp", version = "0.21.55" }
omnizip-snappy = { path = "../../omnizip-snappy", version = "0.21.55" }
tempfile = "3"

[dependencies]
omnizip-archive-core = { path = "../../omnizip-archive-core", version = "0.21.55" }
omnizip-tar = { path = "../../omnizip-tar", version = "0.21.55" }
omnizip-zip = { path = "../../omnizip-zip", version = "0.21.55" }
omnizip-cpio = { path = "../../omnizip-cpio", version = "0.21.55" }
omnizip-sevenzip = { path = "../../omnizip-sevenzip", version = "0.21.55" }
omnizip-xar = { path = "../../omnizip-xar", version = "0.21.55" }
omnizip-rar = { path = "../../omnizip-rar", version = "0.21.55" }
omnizip-rpm = { path = "../../omnizip-rpm", version = "0.21.55" }

[lints]
workspace = true

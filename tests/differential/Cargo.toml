[package]
name = "omnizip-differential"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-language differential test harness for omnizip-rs codecs"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
omnizip-codecs = { path = "../../omnizip-codecs", version = "0.18.0" }
omnizip-lzma = { path = "../../omnizip-lzma", version = "0.18.0" }
omnizip-zstd = { path = "../../omnizip-zstd", version = "0.18.0" }
omnizip-brotli = { path = "../../omnizip-brotli", version = "0.18.0" }
omnizip-bzip2 = { path = "../../omnizip-bzip2", version = "0.18.0" }
omnizip-lz4 = { path = "../../omnizip-lz4", version = "0.18.0" }
omnizip-deflate = { path = "../../omnizip-deflate", version = "0.18.0" }
omnizip-flac = { path = "../../omnizip-flac", version = "0.18.0" }
omnizip-libdeflate = { path = "../../omnizip-libdeflate", version = "0.18.0" }
omnizip-ricepp = { path = "../../omnizip-ricepp", version = "0.18.0" }

omnizip-zstd = { path = "../../omnizip-zstd", version = "0.21.14" }
omnizip-lzma = { path = "../../omnizip-lzma", version = "0.21.14" }
omnizip-lz4 = { path = "../../omnizip-lz4", version = "0.21.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

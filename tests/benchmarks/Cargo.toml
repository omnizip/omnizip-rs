[package]
name = "omnizip-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[test]]
name = "regression"
path = "regression.rs"

[dev-dependencies]
omnizip-codecs = { path = "../../omnizip-codecs", version = "0.21.14" }
